name: Cancel Stale Palindrome PR Runs

on:
  push:
    branches: [agent/osm-africa-mirror-palindrome-scan]
    paths:
      - '.github/workflows/cancel-stale-palindrome-pr-runs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale-pr-runs:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: agent/osm-africa-mirror-palindrome-scan
    steps:
      - name: Cancel only active pull-request runs on the proof branch
        shell: bash
        run: |
          set -euo pipefail
          ids="$(
            gh api --paginate \
              "repos/${REPO}/actions/runs?branch=${BRANCH}&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested") | .id' \
              | sort -n -u
          )"
          count="$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "Found $count active pull_request workflow runs to cancel."
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            echo "Cancelling stale PR run $id"
            gh api --method POST "repos/${REPO}/actions/runs/${id}/cancel" >/dev/null || true
          done <<< "$ids"
          echo "Proof-specific push runs were intentionally untouched."
