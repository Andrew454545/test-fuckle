# Multi-source super-audit: current + historical names, all feature types, all scripts/languages.
name: Global Geographic Name Mirror-Palindrome Super Scan

on:
  push:
    branches: [agent/osm-africa-mirror-palindrome-scan]
    paths:
      - '.github/workflows/osm-europe-mirror-scan.yml'
      - 'scripts/run_geonames_all_historic_visual_scan.py'
      - 'scripts/scan_osm_all_name_opl.py'
      - 'scripts/scan_delimited_gazetteer_names.py'
      - 'scripts/scan_geonames_mirror_palindromes.py'
      - 'scripts/scan_mirror_palindromes.py'
      - 'requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/osm-europe-mirror-scan.yml'
      - 'scripts/run_geonames_all_historic_visual_scan.py'
      - 'scripts/scan_osm_all_name_opl.py'
      - 'scripts/scan_delimited_gazetteer_names.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PLANET_URL: https://planet.openstreetmap.org/pbf/planet-260810.osm.pbf
  PLANET_MD5_URL: https://planet.openstreetmap.org/pbf/planet-260810.osm.pbf.md5
  HISTORY_URL: https://planet.openstreetmap.org/pbf/full-history/history-260810.osm.pbf
  HISTORY_MD5_URL: https://planet.openstreetmap.org/pbf/full-history/history-260810.osm.pbf.md5

jobs:
  geonames-all-historic:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-extra fonts-noto-cjk libicu-dev pkg-config
          python -m pip install -r requirements.txt
      - name: Download complete GeoNames datasets
        run: |
          set -euo pipefail
          mkdir -p geonames artifacts/geonames-historic
          curl -fL --retry 8 https://download.geonames.org/export/dump/allCountries.zip -o geonames/allCountries.zip
          curl -fL --retry 8 https://download.geonames.org/export/dump/alternateNamesV2.zip -o geonames/alternateNamesV2.zip
          curl -fL --retry 8 https://download.geonames.org/export/dump/countryInfo.txt -o geonames/countryInfo.txt
          curl -fL --retry 8 https://download.geonames.org/export/dump/featureCodes_en.txt -o geonames/featureCodes_en.txt
          sha256sum geonames/* | tee artifacts/geonames-historic/source_sha256.txt
          unzip -t geonames/allCountries.zip
          unzip -t geonames/alternateNamesV2.zip
          zip -d geonames/alternateNamesV2.zip iso-languagecodes.txt
      - name: Scan all current and historical GeoNames names
        run: |
          set -o pipefail
          python scripts/run_geonames_all_historic_visual_scan.py \
            --all-countries geonames/allCountries.zip \
            --alternate-names geonames/alternateNamesV2.zip \
            --country-info geonames/countryInfo.txt \
            --feature-codes geonames/featureCodes_en.txt \
            --out artifacts/geonames-historic 2>&1 | tee artifacts/geonames-historic/run.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geonames-all-current-historic-mirror-audit
          path: artifacts/geonames-historic/
          retention-days: 30

  osm-current-all-names:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install scanner dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool fontconfig fonts-noto-core fonts-noto-extra fonts-noto-cjk libicu-dev pkg-config
          python -m pip install -r requirements.txt
      - name: Build naming-key filter
        run: |
          cat > name_filters.txt <<'EOF'
          nwr/name
          nwr/name:*
          nwr/official_name
          nwr/official_name:*
          nwr/loc_name
          nwr/loc_name:*
          nwr/alt_name
          nwr/alt_name:*
          nwr/short_name
          nwr/short_name:*
          nwr/int_name
          nwr/int_name:*
          nwr/nat_name
          nwr/nat_name:*
          nwr/reg_name
          nwr/reg_name:*
          nwr/old_name
          nwr/old_name:*
          nwr/historic_name
          nwr/historic_name:*
          nwr/former_name
          nwr/former_name:*
          nwr/previous_name
          nwr/previous_name:*
          nwr/was:name
          nwr/was:name:*
          nwr/was:official_name
          nwr/was:official_name:*
          EOF
          sed -i 's/^          //' name_filters.txt
      - name: Stream frozen Planet and scan every naming-key object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/osm-current-all-names
          curl -fsSL "$PLANET_MD5_URL" | tee artifacts/osm-current-all-names/official.md5
          rm -f md5.pipe; mkfifo md5.pipe
          (md5sum < md5.pipe | awk '{print $1}' > artifacts/osm-current-all-names/computed.md5) & MPID=$!
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 "$PLANET_URL" \
            | tee md5.pipe \
            | osmium tags-filter -R -F pbf -f opl -e name_filters.txt - \
            | python scripts/scan_osm_all_name_opl.py --out artifacts/osm-current-all-names --source-label OSM-current-260810
          wait "$MPID"; rm -f md5.pipe
          test "$(awk '{print $1}' artifacts/osm-current-all-names/official.md5)" = "$(cat artifacts/osm-current-all-names/computed.md5)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-current-planet-all-name-keys-mirror-audit
          path: artifacts/osm-current-all-names/
          retention-days: 30

  osm-full-history-all-names:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Install scanner dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool fontconfig fonts-noto-core fonts-noto-extra fonts-noto-cjk libicu-dev pkg-config
          python -m pip install -r requirements.txt
      - name: Build naming-key filter
        run: |
          cat > name_filters.txt <<'EOF'
          nwr/name
          nwr/name:*
          nwr/official_name
          nwr/official_name:*
          nwr/loc_name
          nwr/loc_name:*
          nwr/alt_name
          nwr/alt_name:*
          nwr/short_name
          nwr/short_name:*
          nwr/int_name
          nwr/int_name:*
          nwr/nat_name
          nwr/nat_name:*
          nwr/reg_name
          nwr/reg_name:*
          nwr/old_name
          nwr/old_name:*
          nwr/historic_name
          nwr/historic_name:*
          nwr/former_name
          nwr/former_name:*
          nwr/previous_name
          nwr/previous_name:*
          nwr/was:name
          nwr/was:name:*
          nwr/was:official_name
          nwr/was:official_name:*
          EOF
          sed -i 's/^          //' name_filters.txt
      - name: Stream 151GB full-history Planet and scan every historical object version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/osm-full-history
          curl -fsSL "$HISTORY_MD5_URL" | tee artifacts/osm-full-history/official.md5
          rm -f md5.pipe; mkfifo md5.pipe
          (md5sum < md5.pipe | awk '{print $1}' > artifacts/osm-full-history/computed.md5) & MPID=$!
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 "$HISTORY_URL" \
            | tee md5.pipe \
            | osmium tags-filter -R -F pbf -f opl -e name_filters.txt - \
            | python scripts/scan_osm_all_name_opl.py --out artifacts/osm-full-history --source-label OSM-full-history-260810 --history
          wait "$MPID"; rm -f md5.pipe
          test "$(awk '{print $1}' artifacts/osm-full-history/official.md5)" = "$(cat artifacts/osm-full-history/computed.md5)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-full-history-all-name-keys-mirror-audit
          path: artifacts/osm-full-history/
          retention-days: 30

  usgs-gnis-all-names:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-extra fonts-noto-cjk libicu-dev pkg-config
          python -m pip install -r requirements.txt
      - name: Download and scan GNIS All Names and Historical Features
        run: |
          set -euo pipefail
          mkdir -p data artifacts/gnis-all artifacts/gnis-historical
          curl -fL --retry 8 https://prd-tnm.s3.amazonaws.com/StagedProducts/GeographicNames/Topical/AllNames_National_Text.zip -o data/gnis_all.zip
          curl -fL --retry 8 https://prd-tnm.s3.amazonaws.com/StagedProducts/GeographicNames/Topical/HistoricalFeatures_National_Text.zip -o data/gnis_historical.zip
          sha256sum data/*.zip | tee artifacts/gnis_sources.sha256
          python scripts/scan_delimited_gazetteer_names.py --zip data/gnis_all.zip --out artifacts/gnis-all --source-label USGS-GNIS-All-Names
          python scripts/scan_delimited_gazetteer_names.py --zip data/gnis_historical.zip --out artifacts/gnis-historical --source-label USGS-GNIS-Historical-Features
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usgs-gnis-current-variant-historical-mirror-audit
          path: artifacts/
          retention-days: 30

  nga-gns-whole-world:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-extra fonts-noto-cjk libicu-dev pkg-config
          python -m pip install -r requirements.txt
      - name: Download GNS Whole_world and scan all name records
        run: |
          set -euo pipefail
          mkdir -p data artifacts/gns
          URL=https://geonames.nga.mil/geonames/GNSData/Whole_world.zip
          curl -fL --retry 8 --retry-all-errors "$URL" -o data/gns_world.zip
          unzip -t data/gns_world.zip
          sha256sum data/gns_world.zip | tee artifacts/gns/source_sha256.txt
          python scripts/scan_delimited_gazetteer_names.py --zip data/gns_world.zip --out artifacts/gns --source-label NGA-GNS-Whole-world
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nga-gns-whole-world-multilingual-historical-mirror-audit
          path: artifacts/gns/
          retention-days: 30
