name: OSM Full-History 99pct Feature-Name Repair

on:
  push:
    branches: [agent/osm-africa-mirror-palindrome-scan]
    paths:
      - '.github/workflows/nga-gns-rest-rerun.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: osm-full-history-99pct-sequential-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seg01:
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '01'
      start_offset: '0'
      prior_state_artifact: ''

  seg02:
    needs: seg01
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '02'
      start_offset: ${{ needs.seg01.outputs.end_offset }}
      prior_state_artifact: osm-history-state-01

  seg03:
    needs: seg02
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '03'
      start_offset: ${{ needs.seg02.outputs.end_offset }}
      prior_state_artifact: osm-history-state-02

  seg04:
    needs: seg03
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '04'
      start_offset: ${{ needs.seg03.outputs.end_offset }}
      prior_state_artifact: osm-history-state-03

  seg05:
    needs: seg04
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '05'
      start_offset: ${{ needs.seg04.outputs.end_offset }}
      prior_state_artifact: osm-history-state-04

  seg06:
    needs: seg05
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '06'
      start_offset: ${{ needs.seg05.outputs.end_offset }}
      prior_state_artifact: osm-history-state-05

  seg07:
    needs: seg06
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '07'
      start_offset: ${{ needs.seg06.outputs.end_offset }}
      prior_state_artifact: osm-history-state-06

  seg08:
    needs: seg07
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '08'
      start_offset: ${{ needs.seg07.outputs.end_offset }}
      prior_state_artifact: osm-history-state-07

  seg09:
    needs: seg08
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '09'
      start_offset: ${{ needs.seg08.outputs.end_offset }}
      prior_state_artifact: osm-history-state-08

  seg10:
    needs: seg09
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '10'
      start_offset: ${{ needs.seg09.outputs.end_offset }}
      prior_state_artifact: osm-history-state-09

  seg11:
    needs: seg10
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '11'
      start_offset: ${{ needs.seg10.outputs.end_offset }}
      prior_state_artifact: osm-history-state-10

  seg12:
    needs: seg11
    uses: ./.github/workflows/osm-history-segment-worker.yml
    with:
      segment_id: '12'
      start_offset: ${{ needs.seg11.outputs.end_offset }}
      prior_state_artifact: osm-history-state-11

  consolidate:
    needs: seg12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore final continuation state
        uses: actions/download-artifact@v4
        with:
          name: osm-history-state-12
          path: .proof-state/osm-history

      - name: Require exact source completion
        shell: bash
        run: |
          set -euo pipefail
          next="$(cat .proof-state/osm-history/next_offset.txt)"
          total="$(cat .proof-state/osm-history/total_bytes.txt)"
          test "$next" = "$total"
          echo "Complete source coverage: $next / $total bytes"

      - name: Download only this run's successful segment evidence
        uses: actions/download-artifact@v4
        with:
          pattern: osm-history-segment-*
          path: artifacts/downloaded-segments
          merge-multiple: false

      - name: Verify source MD5 and consolidate exact contiguous proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 \
            https://planet.openstreetmap.org/pbf/full-history/history-260810.osm.pbf.md5 \
            -o artifacts/official.md5
          python scripts/consolidate_osm_history_segments.py \
            --segments-dir artifacts/downloaded-segments \
            --md5-state .proof-state/osm-history/md5_state.json \
            --official-md5-file artifacts/official.md5 \
            --out artifacts/osm-full-history-99pct-final

      - name: Upload final full-history proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: osm-full-history-260810-99pct-feature-name-repair
          path: artifacts/osm-full-history-99pct-final/
          retention-days: 30
          if-no-files-found: error
